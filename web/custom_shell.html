<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
:root {
	color-scheme: dark;
}

html, body {
	width: 100%;
	height: 100%;
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	display: flex;
	align-items: center;
	justify-content: center;
	color: white;
	background: black;
	overflow: hidden;
	touch-action: none;
}

#game-frame {
	position: relative;
	flex: 0 0 auto;
	width: 1280px;
	height: 720px;
	background: black;
	overflow: hidden;
}

#canvas {
	display: block;
	width: 100% !important;
	height: 100% !important;
	margin: 0;
	padding: 0;
	border: 0;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 1;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice, #status-message {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-message {
	position: absolute;
	left: 0;
	right: 0;
	top: 50%;
	z-index: 3;
	margin: 0;
	color: #f0e4c8;
	font: 700 clamp(1.5rem, 3vw, 2.25rem)/1.25 "Noto Serif SC", "Microsoft YaHei", serif;
	letter-spacing: 0.12em;
	text-align: center;
	transform: translateY(-50%);
}

#status-notice {
	background-color: #5b3943;
	border: 1px solid #9b3943;
	border-radius: 0.5rem;
	color: #e0e0e0;
	font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 2;
}

#audio-unlock-notice {
	position: absolute;
	left: 50%;
	bottom: 8%;
	z-index: 4;
	display: none;
	padding: 0.65rem 1rem;
	border: 1px solid rgba(221, 196, 148, 0.75);
	border-radius: 0.35rem;
	background: rgba(18, 22, 19, 0.82);
	color: #f0e4c8;
	font: 600 clamp(0.9rem, 1.8vw, 1.1rem)/1.25 "Noto Serif SC", "Microsoft YaHei", serif;
	letter-spacing: 0.06em;
	text-align: center;
	transform: translateX(-50%);
	pointer-events: none;
}

		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<div id="game-frame">
			<canvas id="canvas" aria-label="$GODOT_PROJECT_NAME">
				当前浏览器不支持 Canvas，无法运行游戏。
			</canvas>
			<div id="status">
				<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
				<progress id="status-progress"></progress>
				<div id="status-message">正在编译着色器…</div>
				<div id="status-notice"></div>
			</div>
			<div id="audio-unlock-notice" aria-live="polite">点击任意位置开启声音</div>
		</div>

		<noscript>当前浏览器未启用 JavaScript，无法运行游戏。</noscript>

		<script src="$GODOT_URL"></script>
		<script>
const MAX_DISPLAY_WIDTH = 1920;
const MAX_DISPLAY_HEIGHT = 1080;
const DISPLAY_SIZE_STORAGE_KEY = 'tianyuan_web_display_size';
const DISPLAY_SIZE_PRESETS = [
	{ width: MAX_DISPLAY_WIDTH, height: MAX_DISPLAY_HEIGHT },
	{ width: 1280, height: 720 },
	{ width: 1600, height: 900 },
	{ width: 1920, height: 1080 },
];

function normalizeDisplaySizeIndex(value) {
	const index = Number.parseInt(value, 10);
	return Number.isInteger(index) && index >= 0 && index < DISPLAY_SIZE_PRESETS.length ? index : 0;
}

function loadDisplaySizeIndex() {
	try {
		return normalizeDisplaySizeIndex(window.localStorage.getItem(DISPLAY_SIZE_STORAGE_KEY));
	} catch (_error) {
		return 0;
	}
}

let selectedDisplaySizeIndex = loadDisplaySizeIndex();

function computeGameFrameSize(viewportWidth, viewportHeight, targetWidth, targetHeight) {
	const safeWidth = Math.max(1, Number(viewportWidth) || 1);
	const safeHeight = Math.max(1, Number(viewportHeight) || 1);
	const scale = Math.min(
		1,
		safeWidth / targetWidth,
		safeHeight / targetHeight,
	);
	return {
		width: Math.max(1, Math.floor(targetWidth * scale)),
		height: Math.max(1, Math.floor(targetHeight * scale)),
	};
}

const gameFrame = document.getElementById('game-frame');
const gameCanvas = document.getElementById('canvas');

function resizeGameFrame() {
	const viewport = window.visualViewport;
	const viewportWidth = viewport ? viewport.width : document.documentElement.clientWidth;
	const viewportHeight = viewport ? viewport.height : document.documentElement.clientHeight;
	const preset = DISPLAY_SIZE_PRESETS[selectedDisplaySizeIndex];
	const size = computeGameFrameSize(viewportWidth, viewportHeight, preset.width, preset.height);
	gameFrame.style.width = `${size.width}px`;
	gameFrame.style.height = `${size.height}px`;
}

window.tianyuanSetDisplaySize = function (value) {
	selectedDisplaySizeIndex = normalizeDisplaySizeIndex(value);
	try {
		window.localStorage.setItem(DISPLAY_SIZE_STORAGE_KEY, String(selectedDisplaySizeIndex));
	} catch (_error) {
		// Private browsing can deny storage; the selection still applies for this page.
	}
	resizeGameFrame();
	return selectedDisplaySizeIndex;
};

window.tianyuanGetDisplaySize = function () {
	return selectedDisplaySizeIndex;
};

resizeGameFrame();
window.addEventListener('resize', resizeGameFrame, { passive: true });
document.addEventListener('fullscreenchange', resizeGameFrame);
if (window.visualViewport) {
	window.visualViewport.addEventListener('resize', resizeGameFrame, { passive: true });
}

const webAudioState = {
	contexts: new Set(),
	interacted: false,
	unlocked: false,
};

function notifyWebAudioStateChange() {
	window.dispatchEvent(new Event('tianyuanwebaudiostatechange'));
}

function refreshWebAudioState() {
	const wasUnlocked = webAudioState.unlocked;
	webAudioState.unlocked = webAudioState.contexts.size > 0
		&& Array.from(webAudioState.contexts).every((context) => context.state === 'running');
	if (wasUnlocked !== webAudioState.unlocked) {
		notifyWebAudioStateChange();
	}
	return webAudioState.unlocked;
}

function trackAudioContext(context) {
	webAudioState.contexts.add(context);
	context.addEventListener('statechange', refreshWebAudioState);
	if (webAudioState.interacted && context.state !== 'running') {
		context.resume().then(refreshWebAudioState).catch(refreshWebAudioState);
	}
	refreshWebAudioState();
	return context;
}

(function installAudioContextTracking() {
	const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
	if (!NativeAudioContext) {
		return;
	}
	function TrackingAudioContext(...args) {
		return trackAudioContext(new NativeAudioContext(...args));
	}
	TrackingAudioContext.prototype = NativeAudioContext.prototype;
	Object.setPrototypeOf(TrackingAudioContext, NativeAudioContext);
	try {
		if (window.AudioContext) {
			window.AudioContext = TrackingAudioContext;
		} else {
			window.webkitAudioContext = TrackingAudioContext;
		}
	} catch (_error) {
		// Browsers that expose a read-only constructor still receive Godot's native resume path.
	}
}());

window.tianyuanRequestWebAudioUnlock = function () {
	webAudioState.interacted = true;
	const contexts = Array.from(webAudioState.contexts);
	if (contexts.length === 0) {
		return false;
	}
	Promise.all(contexts.map((context) => context.state === 'running' ? Promise.resolve() : context.resume()))
		.then(refreshWebAudioState)
		.catch(refreshWebAudioState);
	return true;
};

window.tianyuanIsWebAudioUnlocked = function () {
	return webAudioState.unlocked;
};

for (const eventName of ['pointerdown', 'touchstart', 'keydown']) {
	document.addEventListener(eventName, () => window.tianyuanRequestWebAudioUnlock(), {
		capture: true,
		passive: true,
	});
}

const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const statusMessage = document.getElementById('status-message');
	const audioUnlockNotice = document.getElementById('audio-unlock-notice');

	let initializing = true;
	let statusMode = '';
	let gameStarted = false;

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusMessage.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(message) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		String(message).split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(error) {
		console.error(error);
		if (error instanceof Error) {
			setStatusNotice(error.message);
		} else if (typeof error === 'string') {
			setStatusNotice(error);
		} else {
			setStatusNotice('游戏加载时发生未知错误。');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function updateAudioUnlockNotice() {
		audioUnlockNotice.style.display = window.tianyuanIsWebAudioUnlocked() ? 'none' : 'block';
	}

	window.addEventListener('tianyuanwebaudiostatechange', updateAudioUnlockNotice);

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG.serviceWorker && GODOT_CONFIG.ensureCrossOriginIsolationHeaders && 'serviceWorker' in navigator) {
			let registrationPromise;
			try {
				registrationPromise = navigator.serviceWorker.getRegistration();
			} catch (error) {
				registrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				registrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => setTimeout(resolve, 2000)),
			]).then(() => {
				window.location.reload();
			}).catch((error) => {
				console.error('Error while registering service worker:', error);
			});
		} else {
			displayFailureNotice(`当前浏览器缺少运行游戏所需功能：\n${missing.join('\n')}`);
		}
	} else {
		const startGame = () => {
			if (gameStarted) {
				return;
			}
			gameStarted = true;
			setStatusMode('progress');
			engine.startGame({
				canvas: gameCanvas,
				onProgress(current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			}).then(() => {
				setStatusMode('hidden');
				updateAudioUnlockNotice();
			}, displayFailureNotice);
		};
		setStatusMode('progress');
		startGame();
	}
}());
		</script>
	</body>
</html>
